[package]
name = "slow-tictactoe"
version = "0.1.0"
edition = "2021"
description = "Fully on-chain tic-tac-toe for Pulsar L1 mode (every move is a Soroban transaction)."

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "27.0.6" }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
