[package]
name = "session-registry"
version = "0.1.0"
edition = "2021"
description = "Pulsar v0 session lifecycle: open, commit state hashes, settle results, close or force-close."

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = { version = "27.0.6" }

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
